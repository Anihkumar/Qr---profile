<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Profile Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      padding: 20px;
    }

    .card {
      max-width: 420px;
      margin: 50px auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
    }

    h2 {
      margin-bottom: 15px;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f1f1f1;
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Profile Test</h2>
  <pre id="result">Loading...</pre>
</div>

<script>

const SUPABASE_URL =
  "https://auoizmzyojlprmgfhuhf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_86ZOljALd-9xCiCTOgvpkA_HGTxCGgi";

const QR_CODE =
  new URLSearchParams(window.location.search).get("qr") || "TEST-001";


async function testProfile() {

  const result = document.getElementById("result");

  const url =
    SUPABASE_URL +
    "/rest/v1/profiles?select=qr_code,name_1,name_2&qr_code=eq." +
    encodeURIComponent(QR_CODE);

  try {

    const response = await fetch(url, {
      method: "GET",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    });

    const text = await response.text();

    result.textContent =
      "STATUS: " + response.status +
      "\n\nRESPONSE:\n" + text;

  } catch (error) {

    result.textContent =
      "FETCH ERROR:\n\n" + error.message;
  }
}

testProfile();

</script>

</body>
</html>
