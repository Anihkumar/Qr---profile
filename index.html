<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Profile</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    .photo {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #111;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .qr {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .names {
      font-size: 18px;
      margin-top: 15px;
    }

    .loading {
      font-size: 18px;
      color: #555;
    }

    .error {
      color: #d00;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div class="card" id="profile">
    <div class="loading">Loading profile...</div>
  </div>

<script>

const SUPABASE_URL = "https://auoizmzyojlprmgfhuhf.supabase.co";

const QR_CODE = new URLSearchParams(window.location.search)
  .get("qr") || "TEST-001";

async function loadProfile() {

  const box = document.getElementById("profile");

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/profiles?select=qr_code,name_1,name_2,photos(file_path)&qr_code=eq." +
      encodeURIComponent(QR_CODE)
    );

    if (!response.ok) {
      throw new Error("Unable to load profile");
    }

    const data = await response.json();

    if (!data.length) {
      box.innerHTML = `
        <div class="error">
          Profile not found
        </div>
      `;
      return;
    }

    const profile = data[0];

    let photoUrl = "";

    if (profile.photos && profile.photos.file_path) {
      photoUrl =
        SUPABASE_URL +
        "/storage/v1/object/public/Photos/" +
        profile.photos.file_path;
    }

    box.innerHTML = `
      ${
        photoUrl
        ? `<img class="photo" src="${photoUrl}" alt="Profile Photo">`
        : ""
      }

      <h1>${profile.name_1 || ""} ${profile.name_2 || ""}</h1>

      <div class="qr">
        QR Code: ${profile.qr_code}
      </div>

      <div class="names">
        Welcome to your profile
      </div>
    `;

  } catch (error) {

    box.innerHTML = `
      <div class="error">
        Something went wrong while loading the profile.
      </div>
    `;

    console.error(error);
  }
}

loadProfile();

</script>

</body>
</html>
