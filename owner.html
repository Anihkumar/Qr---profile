<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Dashboard</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f5f6fa;
  color:#111827;
}

.container{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.topbar,.card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.04);
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

h1{font-size:22px}
h2{font-size:19px;margin-bottom:16px}

.small{
  color:#6b7280;
  font-size:13px;
  margin-top:5px;
}

label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:9px;
  margin-bottom:14px;
  font-size:15px;
  outline:none;
}

input:focus{border-color:#6366f1}

button{
  cursor:pointer;
}

.primary{
  width:100%;
  border:0;
  padding:13px;
  border-radius:9px;
  background:linear-gradient(135deg,#6366f1,#7c3aed);
  color:white;
  font-weight:bold;
  font-size:15px;
}

.logout{
  border:0;
  background:#111827;
  color:white;
  padding:10px 15px;
  border-radius:9px;
}

.secondary{
  border:1px solid #d1d5db;
  background:white;
  padding:11px 15px;
  border-radius:9px;
  font-weight:bold;
}

.message{
  display:none;
  margin-top:12px;
  padding:11px;
  border-radius:9px;
  font-size:14px;
}

.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.profile-list{
  display:grid;
  gap:10px;
  margin-bottom:18px;
}

.profile-item{
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:14px;
  background:#fafafa;
  cursor:pointer;
}

.profile-item.active{
  border-color:#6366f1;
  background:#f5f3ff;
}

.profile-item strong{
  display:block;
  margin-bottom:4px;
}

.profile-item span{
  color:#6b7280;
  font-size:13px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.photo{
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:12px;
  overflow:hidden;
}

.photo img{
  width:100%;
  height:190px;
  object-fit:cover;
  display:block;
}

.delete-btn{
  width:100%;
  border:0;
  padding:10px;
  background:#fee2e2;
  color:#b91c1c;
  font-weight:bold;
}

.upload-box{
  border:2px dashed #d1d5db;
  border-radius:12px;
  padding:20px;
  text-align:center;
  margin-bottom:12px;
}

.loading{
  text-align:center;
  color:#6b7280;
  padding:20px;
}

.hidden{
  display:none;
}

@media(max-width:600px){
  .container{padding:12px}
  .gallery{grid-template-columns:repeat(2,1fr)}
  .photo img{height:150px}
}
</style>
</head>

<body>

<div class="container">

  <!-- TOP BAR -->

  <div class="topbar">

    <div>
      <h1>Owner Dashboard</h1>
      <p class="small" id="ownerEmail">Checking login...</p>
    </div>

    <button class="logout" id="logoutBtn">
      Logout
    </button>

  </div>


  <!-- CREATE PROFILE -->

  <div class="card">

    <h2>➕ Create New Profile</h2>

    <label>QR Code</label>

    <input
      id="newQr"
      type="text"
      placeholder="Example: TEST-002"
    >

    <label>Name 1</label>

    <input
      id="newName1"
      type="text"
      placeholder="First person name"
    >

    <label>Name 2</label>

    <input
      id="newName2"
      type="text"
      placeholder="Second person name"
    >

    <label>Profile Password</label>

    <input
      id="newPassword"
      type="password"
      placeholder="Password for this profile"
    >

    <button
      class="primary"
      id="createProfileBtn"
    >
      Create Profile
    </button>

    <div
      id="createMessage"
      class="message"
    ></div>

  </div>


  <!-- PROFILE SELECTOR -->

  <div class="card">

    <h2>Profiles</h2>

    <div
      id="profileList"
      class="profile-list"
    >
      <div class="loading">
        Loading profiles...
      </div>
    </div>

  </div>


  <!-- PROFILE DETAILS -->

  <div
    class="card"
    id="managementSection"
  >

    <h2>Profile Details</h2>

    <label>QR Code</label>

    <input
      id="profileCode"
      type="text"
      readonly
    >

    <label>Name 1</label>

    <input
      id="name1"
      type="text"
    >

    <label>Name 2</label>

    <input
      id="name2"
      type="text"
    >

    <button
      class="primary"
      id="saveProfile"
    >
      Save Profile Details
    </button>

    <div
      id="profileMessage"
      class="message"
    ></div>

  </div>


  <!-- UPLOAD -->

  <div
    class="card"
    id="uploadSection"
  >

    <h2>📸 Upload Photo</h2>

    <div class="upload-box">

      <div>Select a photo to upload</div>

      <input
        type="file"
        id="photoInput"
        accept="image/*"
      >

    </div>

    <button
      class="primary"
      id="uploadBtn"
    >
      Upload Photo
    </button>

    <div
      id="uploadMessage"
      class="message"
    ></div>

  </div>


  <!-- GALLERY -->

  <div
    class="card"
    id="gallerySection"
  >

    <h2>🖼️ Manage Photos</h2>

    <div
      id="gallery"
      class="gallery"
    >
      <div class="loading">
        Select a profile.
      </div>
    </div>

  </div>

</div>


<script type="module">

import {
  createClient
} from "https://esm.sh/@supabase/supabase-js@2";


const SUPABASE_URL =
  "https://auoizmzyojlprmgfhuhf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_86ZOljALd-9xCiCTOgvpkA_HGTxCGgi";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;
let currentProfile = null;
let allProfiles = [];


/* =========================
   ELEMENTS
========================= */

const ownerEmail =
  document.getElementById("ownerEmail");

const profileList =
  document.getElementById("profileList");

const profileCode =
  document.getElementById("profileCode");

const name1 =
  document.getElementById("name1");

const name2 =
  document.getElementById("name2");

const gallery =
  document.getElementById("gallery");

const photoInput =
  document.getElementById("photoInput");


/* =========================
   MESSAGE
========================= */

function showMessage(
  element,
  text,
  success
){

  element.textContent = text;

  element.className =
    "message " +
    (success ? "success" : "error");

}


/* =========================
   LOGIN CHECK
========================= */

async function checkLogin(){

  const {
    data,
    error
  } =
  await supabase.auth.getUser();


  if(error || !data.user){

    window.location.href =
      "owner.html";

    return false;
  }


  currentUser =
    data.user;

  ownerEmail.textContent =
    currentUser.email;

  return true;
}


/* =========================
   LOAD ALL PROFILES
========================= */

async function loadProfiles(){

  profileList.innerHTML =
    `<div class="loading">
      Loading profiles...
    </div>`;


  const {
    data,
    error
  } =
  await supabase
    .from("profiles")
    .select(
      "id, qr_code, name_1, name_2"
    )
    .eq(
      "owner_user_id",
      currentUser.id
    )
    .order(
      "created_at",
      { ascending:true }
    );


  if(error){

    console.error(error);

    profileList.innerHTML =
      `<div class="loading">
        Could not load profiles.
      </div>`;

    return;
  }


  allProfiles =
    data || [];


  if(allProfiles.length === 0){

    profileList.innerHTML =
      `<div class="loading">
        No profiles created yet.
      </div>`;

    return;
  }


  profileList.innerHTML = "";


  allProfiles.forEach(
    profile => {

      const item =
        document.createElement("div");

      item.className =
        "profile-item";


      item.innerHTML = `
        <strong>
          ${escapeHtml(profile.name_1)}
          ❤️
          ${escapeHtml(profile.name_2)}
        </strong>

        <span>
          QR: ${escapeHtml(profile.qr_code)}
        </span>
      `;


      item.onclick =
        () => selectProfile(profile);


      profileList.appendChild(item);

    }
  );


  if(!currentProfile){

    selectProfile(
      allProfiles[0]
    );

  }

}


/* =========================
   SELECT PROFILE
========================= */

async function selectProfile(profile){

  currentProfile =
    profile;


  document
    .querySelectorAll(".profile-item")
    .forEach(item =>
      item.classList.remove("active")
    );


  const index =
    allProfiles.findIndex(
      p => p.id === profile.id
    );


  if(index >= 0){

    document
      .querySelectorAll(".profile-item")
      [index]
      .classList.add("active");

  }


  profileCode.value =
    profile.qr_code;

  name1.value =
    profile.name_1;

  name2.value =
    profile.name_2;


  await loadPhotos();

}


/* =========================
   SAVE PROFILE
========================= */

document
.getElementById("saveProfile")
.addEventListener(
  "click",
  async () => {

    if(!currentProfile){

      return;
    }


    const newName1 =
      name1.value.trim();

    const newName2 =
      name2.value.trim();


    if(!newName1 || !newName2){

      showMessage(
        document.getElementById(
          "profileMessage"
        ),
        "Both names are required.",
        false
      );

      return;
    }


    const {
      error
    } =
    await supabase
      .from("profiles")
      .update({
        name_1:newName1,
        name_2:newName2
      })
      .eq(
        "id",
        currentProfile.id
      );


    if(error){

      console.error(error);

      showMessage(
        document.getElementById(
          "profileMessage"
        ),
        "Could not update profile.",
        false
      );

      return;
    }


    currentProfile.name_1 =
      newName1;

    currentProfile.name_2 =
      newName2;


    showMessage(
      document.getElementById(
        "profileMessage"
      ),
      "Profile details saved successfully.",
      true
    );


    await loadProfiles();

  }
);


/* =========================
   CREATE PROFILE
========================= */

document
.getElementById("createProfileBtn")
.addEventListener(
  "click",
  async () => {

    const qr =
      document
        .getElementById("newQr")
        .value
        .trim();

    const n1 =
      document
        .getElementById("newName1")
        .value
        .trim();

    const n2 =
      document
        .getElementById("newName2")
        .value
        .trim();

    const password =
      document
        .getElementById("newPassword")
        .value;


    if(!qr || !n1 || !n2 || !password){

      showMessage(
        document.getElementById(
          "createMessage"
        ),
        "All fields are required.",
        false
      );

      return;
    }


    if(password.length < 4){

      showMessage(
        document.getElementById(
          "createMessage"
        ),
        "Password must be at least 4 characters.",
        false
      );

      return;
    }


    const button =
      document.getElementById(
        "createProfileBtn"
      );


    button.disabled = true;

    button.textContent =
      "Creating...";


    const {
      data,
      error
    } =
    await supabase.rpc(
      "create_profile",
      {
        p_qr_code:qr,
        p_name_1:n1,
        p_name_2:n2,
        p_password:password
      }
    );


    button.disabled = false;

    button.textContent =
      "Create Profile";


    if(error){

      console.error(error);

      showMessage(
        document.getElementById(
          "createMessage"
        ),
        error.message ||
        "Could not create profile.",
        false
      );

      return;
    }


    showMessage(
      document.getElementById(
        "createMessage"
      ),
      "Profile created successfully.",
      true
    );


    document
      .getElementById("newQr")
      .value = "";

    document
      .getElementById("newName1")
      .value = "";

    document
      .getElementById("newName2")
      .value = "";

    document
      .getElementById("newPassword")
      .value = "";


    await loadProfiles();


    if(data && data.length){

      selectProfile(data[0]);

    }

  }
);


/* =========================
   LOAD PHOTOS
========================= */

async function loadPhotos(){

  if(!currentProfile){

    gallery.innerHTML =
      `<div class="loading">
        Select a profile.
      </div>`;

    return;
  }


  gallery.innerHTML =
    `<div class="loading">
      Loading photos...
    </div>`;


  const {
    data:photos,
    error
  } =
  await supabase
    .from("photos")
    .select(
      "id,file_path,uploaded_at"
    )
    .eq(
      "profile_id",
      currentProfile.id
    )
    .order(
      "uploaded_at",
      {ascending:false}
    );


  if(error){

    console.error(error);

    gallery.innerHTML =
      `<div class="loading">
        Could not load photos.
      </div>`;

    return;
  }


  if(!photos || photos.length === 0){

    gallery.innerHTML =
      `<div class="loading">
        No photos uploaded yet.
      </div>`;

    return;
  }


  gallery.innerHTML = "";


  for(const photo of photos){

    const {
      data:signed,
      error:signedError
    } =
    await supabase.storage
      .from("Photos")
      .createSignedUrl(
        photo.file_path,
        3600
      );


    if(signedError || !signed){

      continue;
    }


    const box =
      document.createElement("div");

    box.className =
      "photo";


    const image =
      document.createElement("img");

    image.src =
      signed.signedUrl;


    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete-btn";

    deleteButton.textContent =
      "🗑️ Delete Photo";


    deleteButton.onclick =
      () => deletePhoto(photo);


    box.appendChild(image);

    box.appendChild(
      deleteButton
    );

    gallery.appendChild(box);

  }

}


/* =========================
   UPLOAD
========================= */

document
.getElementById("uploadBtn")
.addEventListener(
  "click",
  async () => {

    if(!currentProfile){

      return;
    }


    const file =
      photoInput.files[0];


    if(!file){

      showMessage(
        document.getElementById(
          "uploadMessage"
        ),
        "Please select a photo first.",
        false
      );

      return;
    }


    if(!file.type.startsWith("image/")){

      showMessage(
        document.getElementById(
          "uploadMessage"
        ),
        "Only image files are allowed.",
        false
      );

      return;
    }


    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const fileName =
      `${crypto.randomUUID()}.${extension}`;


    const filePath =
      `${currentProfile.qr_code}/${fileName}`;


    const {
      error:uploadError
    } =
    await supabase.storage
      .from("Photos")
      .upload(
        filePath,
        file,
        {
          contentType:file.type,
          upsert:false
        }
      );


    if(uploadError){

      console.error(uploadError);

      showMessage(
        document.getElementById(
          "uploadMessage"
        ),
        "Photo upload failed.",
        false
      );

      return;
    }


    const {
      error:dbError
    } =
    await supabase
      .from("photos")
      .insert({
        profile_id:
          currentProfile.id,
        file_path:
          filePath
      });


    if(dbError){

      console.error(dbError);

      await supabase.storage
        .from("Photos")
        .remove([filePath]);


      showMessage(
        document.getElementById(
          "uploadMessage"
        ),
        "Could not save photo record.",
        false
      );

      return;
    }


    photoInput.value = "";


    showMessage(
      document.getElementById(
        "uploadMessage"
      ),
      "Photo uploaded successfully.",
      true
    );


    await loadPhotos();

  }
);


/* =========================
   DELETE
========================= */

async function deletePhoto(photo){

  if(
    !confirm(
      "Are you sure you want to delete this photo?"
    )
  ){

    return;
  }


  const {
    error:storageError
  } =
  await supabase.storage
    .from("Photos")
    .remove([
      photo.file_path
    ]);


  if(storageError){

    console.error(storageError);

    alert(
      "Could not delete photo."
    );

    return;
  }


  const {
    error:dbError
  } =
  await supabase
    .from("photos")
    .delete()
    .eq(
      "id",
      photo.id
    );


  if(dbError){

    console.error(dbError);

    alert(
      "Photo database record could not be deleted."
    );

    return;
  }


  await loadPhotos();

}


/* =========================
   LOGOUT
========================= */

document
.getElementById("logoutBtn")
.addEventListener(
  "click",
  async () => {

    await supabase.auth.signOut();

    window.location.href =
      "owner.html";

  }
);


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

const loggedIn =
  await checkLogin();


if(loggedIn){

  await loadProfiles();

}

</script>

</body>
</html>
