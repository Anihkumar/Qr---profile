<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Owner Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .topbar {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .topbar h1 {
      font-size: 22px;
    }

    .topbar p {
      margin-top: 5px;
      color: #6b7280;
      font-size: 13px;
    }

    .logout {
      border: none;
      background: #111827;
      color: white;
      padding: 10px 15px;
      border-radius: 9px;
      cursor: pointer;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.04);
    }

    .card h2 {
      font-size: 19px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      margin-bottom: 14px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #6366f1;
    }

    .primary {
      width: 100%;
      border: none;
      padding: 13px;
      border-radius: 9px;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .upload-box {
      border: 2px dashed #d1d5db;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 12px;
    }

    .upload-box input {
      margin-top: 12px;
      margin-bottom: 0;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .photo {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
    }

    .photo img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
    }

    .delete-btn {
      width: 100%;
      border: none;
      padding: 10px;
      background: #fee2e2;
      color: #b91c1c;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      display: none;
      margin-top: 12px;
      padding: 11px;
      border-radius: 9px;
      font-size: 14px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      color: #6b7280;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      .topbar {
        align-items: flex-start;
      }

      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }

      .photo img {
        height: 150px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="topbar">

    <div>
      <h1>Owner Dashboard</h1>
      <p id="ownerEmail">Checking login...</p>
    </div>

    <button class="logout" id="logoutBtn">
      Logout
    </button>

  </div>


  <!-- PROFILE DETAILS -->

  <div class="card">

    <h2>Profile Details</h2>

    <label>Profile</label>

    <input
      id="profileCode"
      type="text"
      readonly
    >

    <label>Name 1</label>

    <input
      id="name1"
      type="text"
    >

    <label>Name 2</label>

    <input
      id="name2"
      type="text"
    >

    <button
      class="primary"
      id="saveProfile"
    >
      Save Profile Details
    </button>

    <div
      id="profileMessage"
      class="message"
    ></div>

  </div>


  <!-- UPLOAD -->

  <div class="card">

    <h2>Upload Photo</h2>

    <div class="upload-box">

      <div>
        Select a photo to upload
      </div>

      <input
        type="file"
        id="photoInput"
        accept="image/*"
      >

    </div>

    <button
      class="primary"
      id="uploadBtn"
    >
      Upload Photo
    </button>

    <div
      id="uploadMessage"
      class="message"
    ></div>

  </div>


  <!-- GALLERY -->

  <div class="card">

    <h2>Manage Photos</h2>

    <div
      id="gallery"
      class="gallery"
    >
      <div class="loading">
        Loading photos...
      </div>
    </div>

  </div>

</div>


<script type="module">

import {
  createClient
} from "https://esm.sh/@supabase/supabase-js@2";


const SUPABASE_URL =
  "https://auoizmzyojlprmgfhuhf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_86ZOljALd-9xCiCTOgvpkA_HGTxCGgi";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;
let currentProfile = null;


/* =========================
   ELEMENTS
========================= */

const ownerEmail =
  document.getElementById("ownerEmail");

const profileCode =
  document.getElementById("profileCode");

const name1 =
  document.getElementById("name1");

const name2 =
  document.getElementById("name2");

const gallery =
  document.getElementById("gallery");

const photoInput =
  document.getElementById("photoInput");


/* =========================
   MESSAGE
========================= */

function showMessage(
  element,
  text,
  success
) {

  element.textContent = text;

  element.className =
    "message " +
    (success ? "success" : "error");

  element.style.display =
    "block";

}


/* =========================
   CHECK LOGIN
========================= */

async function checkLogin() {

  const {
    data,
    error
  } = await supabase.auth.getUser();


  if (
    error ||
    !data.user
  ) {

    window.location.href =
      "owner.html";

    return false;
  }


  currentUser =
    data.user;

  ownerEmail.textContent =
    currentUser.email;


  return true;
}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile() {

  const {
    data,
    error
  } = await supabase
    .from("profiles")
    .select(
      "id, qr_code, name_1, name_2"
    )
    .eq(
      "owner_user_id",
      currentUser.id
    )
    .limit(1)
    .maybeSingle();


  if (error) {

    console.error(error);

    alert(
      "Could not load profile."
    );

    return;
  }


  if (!data) {

    alert(
      "No profile is linked to this owner."
    );

    return;
  }


  currentProfile =
    data;


  profileCode.value =
    data.qr_code;

  name1.value =
    data.name_1;

  name2.value =
    data.name_2;


  await loadPhotos();

}


/* =========================
   LOAD PHOTOS
========================= */

async function loadPhotos() {

  gallery.innerHTML =
    `<div class="loading">
      Loading photos...
    </div>`;


  const {
    data: photos,
    error
  } = await supabase
    .from("photos")
    .select(
      "id, file_path, uploaded_at"
    )
    .eq(
      "profile_id",
      currentProfile.id
    )
    .order(
      "uploaded_at",
      {
        ascending: false
      }
    );


  if (error) {

    console.error(error);

    gallery.innerHTML =
      `<div class="loading">
        Could not load photos.
      </div>`;

    return;
  }


  if (
    !photos ||
    photos.length === 0
  ) {

    gallery.innerHTML =
      `<div class="loading">
        No photos uploaded yet.
      </div>`;

    return;
  }


  gallery.innerHTML = "";


  for (
    const photo of photos
  ) {

    const {
      data: signed,
      error: signedError
    } =
      await supabase.storage
        .from("Photos")
        .createSignedUrl(
          photo.file_path,
          3600
        );


    if (
      signedError ||
      !signed
    ) {

      continue;
    }


    const box =
      document.createElement("div");

    box.className =
      "photo";


    const image =
      document.createElement("img");

    image.src =
      signed.signedUrl;


    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete-btn";

    deleteButton.textContent =
      "🗑️ Delete Photo";


    deleteButton.onclick =
      () => deletePhoto(photo);


    box.appendChild(image);

    box.appendChild(
      deleteButton
    );

    gallery.appendChild(box);

  }

}


/* =========================
   SAVE PROFILE
========================= */

document
  .getElementById("saveProfile")
  .addEventListener(
    "click",
    async () => {

      const newName1 =
        name1.value.trim();

      const newName2 =
        name2.value.trim();


      if (
        !newName1 ||
        !newName2
      ) {

        showMessage(
          document.getElementById(
            "profileMessage"
          ),
          "Both names are required.",
          false
        );

        return;
      }


      const {
        error
      } = await supabase
        .from("profiles")
        .update({
          name_1: newName1,
          name_2: newName2
        })
        .eq(
          "id",
          currentProfile.id
        );


      if (error) {

        console.error(error);

        showMessage(
          document.getElementById(
            "profileMessage"
          ),
          "Could not update profile.",
          false
        );

        return;
      }


      showMessage(
        document.getElementById(
          "profileMessage"
        ),
        "Profile details saved successfully.",
        true
      );

    }
  );


/* =========================
   UPLOAD PHOTO
========================= */

document
  .getElementById("uploadBtn")
  .addEventListener(
    "click",
    async () => {

      const file =
        photoInput.files[0];


      if (!file) {

        showMessage(
          document.getElementById(
            "uploadMessage"
          ),
          "Please select a photo first.",
          false
        );

        return;
      }


      if (!file.type.startsWith("image/")) {

        showMessage(
          document.getElementById(
            "uploadMessage"
          ),
          "Only image files are allowed.",
          false
        );

        return;
      }


      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      const fileName =
        `${crypto.randomUUID()}.${extension}`;


      const filePath =
        `${currentProfile.qr_code}/${fileName}`;


      const {
        error: uploadError
      } =
        await supabase.storage
          .from("Photos")
          .upload(
            filePath,
            file,
            {
              contentType:
                file.type,
              upsert: false
            }
          );


      if (uploadError) {

        console.error(uploadError);

        showMessage(
          document.getElementById(
            "uploadMessage"
          ),
          "Photo upload failed.",
          false
        );

        return;
      }


      const {
        error: dbError
      } =
        await supabase
          .from("photos")
          .insert({
            profile_id:
              currentProfile.id,

            file_path:
              filePath
          });


      if (dbError) {

        console.error(dbError);

        /*
          Remove uploaded file if
          database insert fails.
        */

        await supabase.storage
          .from("Photos")
          .remove([
            filePath
          ]);


        showMessage(
          document.getElementById(
            "uploadMessage"
          ),
          "Photo database record could not be created.",
          false
        );

        return;
      }


      photoInput.value = "";


      showMessage(
        document.getElementById(
          "uploadMessage"
        ),
        "Photo uploaded successfully.",
        true
      );


      await loadPhotos();

    }
  );


/* =========================
   DELETE PHOTO
========================= */

async function deletePhoto(photo) {

  const confirmed =
    confirm(
      "Are you sure you want to delete this photo?"
    );


  if (!confirmed) {
    return;
  }


  const {
    error: storageError
  } =
    await supabase.storage
      .from("Photos")
      .remove([
        photo.file_path
      ]);


  if (storageError) {

    console.error(storageError);

    alert(
      "Could not delete photo from storage."
    );

    return;
  }


  const {
    error: dbError
  } =
    await supabase
      .from("photos")
      .delete()
      .eq(
        "id",
        photo.id
      );


  if (dbError) {

    console.error(dbError);

    alert(
      "Photo file was deleted, but database record could not be removed."
    );

    return;
  }


  await loadPhotos();

}


/* =========================
   LOGOUT
========================= */

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async () => {

      await supabase.auth.signOut();

      window.location.href =
        "owner.html";

    }
  );


/* =========================
   START
========================= */

const loggedIn =
  await checkLogin();


if (loggedIn) {

  await loadProfile();

}

</script>

</body>
</html>
