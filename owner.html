<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #111827;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 30px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    .icon {
      text-align: center;
      font-size: 44px;
      margin-bottom: 12px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 16px;
      outline: none;
    }

    input:focus {
      border-color: #6366f1;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="icon">🔐</div>

    <h1>Owner Login</h1>

    <p class="subtitle">
      Sign in to manage your profile
    </p>

    <label>Email Address</label>

    <input
      type="email"
      id="email"
      placeholder="Enter owner email"
      autocomplete="email"
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter owner password"
      autocomplete="current-password"
    >

    <button id="loginButton">
      Login
    </button>

    <div id="message"></div>

  </div>


  <script type="module">

    import {
      createClient
    } from "https://esm.sh/@supabase/supabase-js@2";


    const SUPABASE_URL =
      "https://auoizmzyojlprmgfhuhf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_86ZOljALd-9xCiCTOgvpkA_HGTxCGgi";


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    function showMessage(text, success = false) {

      message.textContent = text;

      message.style.display = "block";

      message.style.background =
        success ? "#dcfce7" : "#fee2e2";

      message.style.color =
        success ? "#166534" : "#991b1b";
    }


    async function login() {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      if (!email || !password) {

        showMessage(
          "Please enter email and password."
        );

        return;
      }


      loginButton.disabled = true;

      loginButton.textContent =
        "Signing in...";


      const {
        data,
        error
      } = await supabase.auth.signInWithPassword({

        email: email,

        password: password

      });


      if (error) {

        showMessage(
          "Invalid email or password."
        );

        loginButton.disabled = false;

        loginButton.textContent =
          "Login";

        return;
      }


      if (!data.session) {

        showMessage(
          "Login session could not be created."
        );

        loginButton.disabled = false;

        loginButton.textContent =
          "Login";

        return;
      }


      showMessage(
        "Login successful!",
        true
      );


      /*
        Temporary redirect.
        Owner dashboard will be created next.
      */

      setTimeout(() => {

        window.location.href =
          "owner.html";

      }, 700);

    }


    loginButton.addEventListener(
      "click",
      login
    );


    passwordInput.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Enter") {

          login();

        }

      }
    );

  </script>

</body>
</html>
